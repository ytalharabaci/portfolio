<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Top Face Gradient: Subtle glossy slate/obsidian -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Left Face Gradient: Terminal dark screen obsidian -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Right Face Gradient: Deep obsidian shadow facet -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="60%" stop-color="#04070f"/>
      <stop offset="100%" stop-color="#010206"/>
    </linearGradient>

    <!-- Electric Neon Cyan Gradient (Prompt) -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Neon Emerald / Turquoise Gradient (Cursor) -->
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="cyberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow for the 3D Block -->
    <filter id="blockShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#00f2fe" flood-opacity="0.25"/>
    </filter>

    <!-- Edge Highlight Gradients -->
    <linearGradient id="edgeGlowTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="spineGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Monolith -->
  <circle cx="256" cy="270" r="190" fill="#0284c7" opacity="0.12" filter="blur(40px)"/>

  <!-- 3D Isometric Cube Container with Drop Shadow -->
  <g filter="url(#blockShadow)">
    <!-- 1. Top Face -->
    <polygon points="256,56 432,158 256,260 80,158" 
             fill="url(#topFace)" 
             stroke="url(#edgeGlowTop)" 
             stroke-width="3" 
             stroke-linejoin="round"/>

    <!-- 2. Left Face (Terminal Screen) -->
    <polygon points="80,158 256,260 256,456 80,354" 
             fill="url(#leftFace)" 
             stroke="#1e293b" 
             stroke-width="2" 
             stroke-linejoin="round"/>

    <!-- 3. Right Face (Terminal Body / Depth) -->
    <polygon points="256,260 432,158 432,354 256,456" 
             fill="url(#rightFace)" 
             stroke="#1e293b" 
             stroke-width="2" 
             stroke-linejoin="round"/>

    <!-- Center Spine Edge Highlight -->
    <line x1="256" y1="260" x2="256" y2="456" stroke="url(#spineGlow)" stroke-width="3"/>
  </g>

  <!-- 4. Top Face Futuristic Terminal Grid Accents -->
  <line x1="168" y1="107" x2="344" y2="209" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25"/>
  <line x1="212" y1="81.5" x2="388" y2="183.5" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.15"/>
  <!-- Status dots on top bevel -->
  <circle cx="120" cy="140" r="5" fill="#f43f5e" opacity="0.9"/>
  <circle cx="140" cy="130" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="160" cy="120" r="5" fill="#22c55e" opacity="0.9"/>

  <!-- 5. Left Face: Isometric Terminal Prompt '>' (Bold Glowing Neon Cyan) -->
  <g filter="url(#cyberGlow)">
    <path d="M 125 225 L 210 295 L 125 355" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- 6. Right Face: Isometric Terminal Cursor '_' (Glowing Neon Emerald) -->
  <g filter="url(#cyberGlow)">
    <!-- Slanted in isometric perspective along the right face plane -->
    <line x1="295" y1="380" x2="395" y2="322" 
          stroke="url(#neonEmerald)" 
          stroke-width="32" 
          stroke-linecap="round"/>
  </g>

  <!-- Corner Pin Light Reflection on Top Vertex -->
  <circle cx="256" cy="56" r="4" fill="#ffffff" filter="url(#cyberGlow)"/>
</svg>